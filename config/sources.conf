# Component sources: component|git url|branch
# branch "auto" = pick the newest versioned branch (resolve-branch.sh).
# Components matching a Proton submodule path are swapped to the given
# repo/branch. "protonfixes" is cloned into the Proton tree (the cachyos
# fork patches build and package it from there).
#
# proton and wine track Valve bleeding-edge; the CachyOS fork changes
# are applied on top from patches/proton and patches/wine (regenerate
# with scripts/extract-fork-patches.sh).
proton|https://github.com/ValveSoftware/Proton.git|bleeding-edge
wine|https://github.com/ValveSoftware/wine.git|bleeding-edge
dxvk|https://github.com/doitsujin/dxvk.git|master
vkd3d-proton|https://github.com/HansKristian-Work/vkd3d-proton.git|master
dxvk-nvapi|https://github.com/jp7677/dxvk-nvapi.git|master
protonfixes|https://github.com/Open-Wine-Components/umu-protonfixes.git|master
